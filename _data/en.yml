research:
  title: Research
  publications:
    title: Publications
    papers:
      - name: "Pandemic Shocks and Unintended Healthcare Disruptions: Chronic Patients During COVID-19"
        coauthors: with Claudio Lucifora & Antonio Russo
        subheading: "Empirical Economics, 2026"
        link: "https://doi.org/10.1007/s00181-025-02851-9"
        description: |
          This paper investigates the effects of pandemic shocks on outpatient care utilization among chronic patients aged 50 and older in Italy. We merge administrative data on outpatient services with information on excess deaths to proxy the severity of pandemic shocks during COVID-19. To account for confounding factors and individual-level unobserved heterogeneity, we implement an individual-level fixed-effects estimator. Our results indicate that excess deaths are associated with a decline in the probability of receiving at least one medical treatment per month. A heterogeneity analysis reveals that the reduction is more substantial for patients with comorbidities, who exhibit a larger prevalence-response elasticity, indicating that sicker patients are more sensitive to pandemic severity. These findings suggest that pandemic shocks influence healthcare-seeking behaviour even among patients previously thought to have inelastic demand.
      - name: "Big Five Personality Traits and Retirement Decisions"
        coauthors: with Claudio Lucifora
        subheading: "Labour, 2021"
        link: "https://doi.org/10.1111/labr.12210"
        description: |
          We estimate the effect of the Big Five personality traits on the retirement decisions of individuals aged between 50 and 80 years in fourteen European countries, using wave 7 from the SHARE data. We investigate the probability of retirement and a measure of the distance between actual retirement and ordinary retirement age. Overall, we find that personality affects retirement decisions, and the effects are similar across gender. Openness to experience, conscientiousness and extraversion are generally associated with a delay in retirement decisions, whereas neuroticism anticipates the exit from the labour market.
  work_in_progress:
    title: Work in Progress
    papers:
      - name: "When Female Doctors Fly In: Access to Female Physicians and Health Care Utilisation"
        description: |
          Policies addressing physician shortages typically target aggregate supply, but workforce gender composition may also shape which health needs get met in underserved communities. I study a program that periodically sends a visiting female GP to small Australian towns where every other practising doctor is male, with visit dates set by her own availability rather than local demand: a unique setting in which the same woman can be observed choosing between a female and a male provider over time, linked at the patient level to her Medicare and pharmaceutical records. Women sort sharply into care with the visiting GP: a consultation with her is nearly four times as likely to run long, and the same woman is roughly four times more likely to be prescribed hormonal medication, while her likelihood of receiving cardiovascular or mental health treatment is unchanged. Preventive care also increases: a woman who sees the visiting GP is over ten times more likely to be screened that day. A difference-in-differences design shows these effects extend beyond direct users: cervical screening also rises among women who never see the visiting GP, consistent with broader changes in screening behaviour once the program becomes available.
      - name: "From Awareness to Action: Help-Seeking and Femicides after Gender-Based Violence Campaigns in Italy"
        coauthors: with Margherita Agnoletto
        description: |
          Awareness campaigns are among the most widely deployed policy responses to gender-based violence, yet systematic evidence on their behavioural effects remains scarce. This paper examines whether variation in campaign intensity around the International Day for the Elimination of Violence against Women (November 25) affects help-seeking behaviour and femicide rates in Italy. We exploit the unusually high salience of the 2023 campaign in a difference-in-differences design that compares outcomes before and after November 25 across years of varying intensity. Helpline calls to the national 1522 anti-violence line increase by approximately 160 percent in the weeks following the high-intensity campaign, with the effect concentrated among non-victim callers. Femicides decline by approximately 61 percent during high-intensity campaign months. Event-study specifications reveal no differential pre-trends, and placebo tests yield null effects for alternative treatment years, supporting a causal interpretation of the estimates. These findings suggest that recurring awareness campaigns can be effective tools for gender-based violence prevention.
      - name: "When Dads Can't Get on the Beers: The Positive Impact of COVID-19 on Parental Drinking Behaviour"
        coauthors: with Susan Mendez, Susan Sawyer & Julie Moschion
        description: |
          This study investigates the effects of the COVID-19 pandemic on alcohol consumption among parents. We use data from the Victorian Adolescent Health Cohort Study (VAHCS) with detailed information on alcohol consumption. Our empirical strategy follows a difference-in-differences design that relies on quasi-random variation in the timing of interviews. Our results show a significant decline in heavy drinking among parents, driven primarily by fathers. This reduction strengthens with prolonged lockdown exposure. Additionally, fathers exhibit a reduction in depressive symptoms and a decrease in cigarette use. Descriptive text analysis indicates that spending more time with family is the most frequently mentioned positive aspect of the lockdowns. This increased family engagement may have contributed to reduced drinking, as stronger family engagement may encourage healthier behaviours in the home environment or reduce opportunities for alcohol consumption.
